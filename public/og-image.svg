<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0a0c16"/>
      <stop offset="100%" stopColor="#121726"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#f59e0b"/>
      <stop offset="100%" stopColor="#ff4726"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#2a3650" stroke-width="4"/>
  <rect x="28" y="28" width="1144" height="574" rx="12" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Blood Moon -->
  <circle cx="1020" cy="180" r="80" fill="#f59e0b" opacity="0.15"/>
  <circle cx="1020" cy="180" r="50" fill="#ff4726" opacity="0.3"/>

  <!-- Badge -->
  <rect x="80" y="100" width="360" height="40" rx="8" fill="#172033" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="100" y="126" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" letter-spacing="2">
    STATUS: ACTIVE // OPEN TO QUESTS
  </text>

  <!-- Title -->
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Ruhaan Kakar
  </text>

  <!-- Role -->
  <text x="80" y="280" font-family="monospace" font-size="24" font-weight="bold" fill="url(#goldGrad)" letter-spacing="1">
    &gt; Frontend &amp; Full-Stack Architect
  </text>

  <!-- Tagline -->
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8">
    Crafting resilient, high-velocity web experiences with surgical precision.
  </text>

  <!-- Stats Pill Box -->
  <g transform="translate(80, 410)">
    <rect width="220" height="70" rx="10" fill="#172033" stroke="#2a3650"/>
    <text x="20" y="30" font-family="monospace" font-size="12" fill="#94a3b8">PLAYER LEVEL</text>
    <text x="20" y="55" font-family="monospace" font-size="18" font-weight="bold" fill="#38bdf8">LVL 4 ARCHITECT</text>
  </g>

  <g transform="translate(320, 410)">
    <rect width="220" height="70" rx="10" fill="#172033" stroke="#2a3650"/>
    <text x="20" y="30" font-family="monospace" font-size="12" fill="#94a3b8">GOLD ARTIFACTS</text>
    <text x="20" y="55" font-family="monospace" font-size="18" font-weight="bold" fill="#f59e0b">4 COMPLETED</text>
  </g>

  <g transform="translate(560, 410)">
    <rect width="220" height="70" rx="10" fill="#172033" stroke="#2a3650"/>
    <text x="20" y="30" font-family="monospace" font-size="12" fill="#94a3b8">LIVES / SLOTS</text>
    <text x="20" y="55" font-family="monospace" font-size="18" font-weight="bold" fill="#ff4726">1 AVAILABLE</text>
  </g>

  <!-- Dragon Vector Silhouette on Right -->
  <g transform="translate(880, 240) scale(1.6)">
    <path d="M16 44 L22 36 L26 38 L30 28 L38 24 L46 22 L52 26 L46 32 L50 38 L42 42 L34 46 L24 48 Z" fill="#ff4726"/>
    <polygon points="34,26 28,14 38,22" fill="#f59e0b"/>
    <circle cx="42" cy="28" r="3" fill="#f59e0b"/>
    <circle cx="42" cy="28" r="1.5" fill="#0a0c16"/>
  </g>
</svg>
